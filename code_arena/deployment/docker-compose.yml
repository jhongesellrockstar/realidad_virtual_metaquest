name: code-arena

services:
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_MULTIPLAYER_URL: ${NEXT_PUBLIC_MULTIPLAYER_URL:-http://localhost}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${NEXT_PUBLIC_MULTIPLAYER_URL:-http://localhost}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-code-arena-daf7b}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-admin.json
      PORT: 4000
    expose:
      - "4000"
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE}:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/code-arena.http.conf:/etc/nginx/conf.d/default.conf:ro
