services:
  - type: web
    runtime: node
    name: code-arena-daf7b-api
    rootDir: code_arena/server
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: code-arena-daf7b
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: CORS_ORIGIN
        value: https://code-arena-daf7b.onrender.com

  - type: web
    runtime: static
    name: code-arena-daf7b
    rootDir: code_arena/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: RENDER_STATIC_EXPORT
        value: "true"
      - key: NEXT_PUBLIC_MULTIPLAYER_URL
        value: https://code-arena-daf7b-api.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
